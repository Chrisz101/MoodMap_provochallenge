<!DOCTYPE html>
<html>
<head>
    <title>MoodMap – Reddit Emotion Analyzer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/venn.js/0.2.20/venn.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .loading { color: gray; font-style: italic; }
        #summary { margin-top: 10px; font-weight: bold; }
        .grouped { margin-top: 20px; }
        .emotion-group { margin-bottom: 15px; }
        canvas { margin-top: 20px; }
        #venn svg { background: #f5f5f5; border: 1px solid #ddd; padding: 10px; }
    </style>
</head>
<body>
    <h2>MoodMap: Reddit Emotion Analyzer</h2>

    <label><strong>Select Subreddits (comma separated):</strong></label><br>
    <input id="subreddit" placeholder="e.g., relationships, Anxiety, teenagers" size="50"/><br><br>

    <label><strong>Number of posts to analyze:</strong></label>
    <select id="postCount">
        <option>3</option>
        <option selected>5</option>
        <option>10</option>
    </select>

    <button onclick="analyze()">Analyze</button>

    <div id="summary"></div>
    <div id="results" class="grouped"></div>
    <canvas id="moodChart" width="600" height="300"></canvas>
    <div id="venn" style="width:800px;height:400px;"></div>

    <script>
        async function analyze() {
            const subreddits = document.getElementById("subreddit").value.split(",").map(s => s.trim());
            const num_posts = document.getElementById("postCount").value;

            document.getElementById("results").innerHTML = "<p class='loading'>⏳ Analyzing posts and emotions...</p>";
            document.getElementById("summary").innerHTML = "";

            const res = await fetch("/analyze", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ subreddits, num_posts })
            });

            const data = await res.json();
            const emotionCounts = {};
            const emotionPosts = {};
            const emotionSets = {};
            let totalPosts = 0;

            for (const [sub, posts] of Object.entries(data)) {
                emotionSets[sub] = new Set();
                posts.forEach(({ text, emotion }) => {
                    emotion = emotion.trim();
                    emotionCounts[emotion] = (emotionCounts[emotion] || 0) + 1;
                    emotionSets[sub].add(emotion);
                    emotionPosts[emotion] = emotionPosts[emotion] || [];
                    emotionPosts[emotion].push(text);
                    totalPosts++;
                });
            }

            const summaryText = Object.entries(emotionCounts).map(([e, c]) => `${c} ${e}`).join(", ");
            document.getElementById("summary").innerHTML = `Out of ${totalPosts} posts analyzed: ${summaryText}`;

            let groupedHTML = "";
            for (const [emotion, posts] of Object.entries(emotionPosts)) {
                groupedHTML += `<div class='emotion-group'><h4>${emotion}</h4>`;
                posts.forEach(p => groupedHTML += `<p>${p}</p>`);
                groupedHTML += `</div>`;
            }
            document.getElementById("results").innerHTML = groupedHTML;

            const ctx = document.getElementById("moodChart").getContext("2d");
            const colors = [
                "rgba(255, 99, 132, 0.6)", "rgba(54, 162, 235, 0.6)", "rgba(255, 206, 86, 0.6)",
                "rgba(75, 192, 192, 0.6)", "rgba(153, 102, 255, 0.6)", "rgba(255, 159, 64, 0.6)"
            ];
            new Chart(ctx, {
                type: "bar",
                data: {
                    labels: Object.keys(emotionCounts),
                    datasets: [{
                        label: "# of Posts by Emotion",
                        data: Object.values(emotionCounts),
                        backgroundColor: colors,
                        borderColor: colors.map(c => c.replace("0.6", "1")),
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    scales: { y: { beginAtZero: true } }
                }
            });

            const vennData = [];
            const keys = Object.keys(emotionSets);
            for (let i = 0; i < keys.length; i++) {
                vennData.push({ sets: [keys[i]], size: emotionSets[keys[i]].size });
            }
            if (keys.length === 3) {
                vennData.push({
                    sets: [keys[0], keys[1]],
                    size: new Set([...emotionSets[keys[0]]].filter(x => emotionSets[keys[1]].has(x))).size
                });
                vennData.push({
                    sets: [keys[1], keys[2]],
                    size: new Set([...emotionSets[keys[1]]].filter(x => emotionSets[keys[2]].has(x))).size
                });
                vennData.push({
                    sets: [keys[0], keys[2]],
                    size: new Set([...emotionSets[keys[0]]].filter(x => emotionSets[keys[2]].has(x))).size
                });
                vennData.push({
                    sets: [keys[0], keys[1], keys[2]],
                    size: [...emotionSets[keys[0]]].filter(x => emotionSets[keys[1]].has(x) && emotionSets[keys[2]].has(x)).length
                });
            }

            document.getElementById("venn").innerHTML = "";
            const chart = venn.VennDiagram().width(800).height(400);
            chart(document.getElementById("venn")).data(vennData);
        }
    </script>
</body>
</html>
